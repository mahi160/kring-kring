# Checks every push and PR. On main it also publishes the build as the
# `hub-build` release; the hub container installs it within ~5 minutes
# (infra/hub-update). Nothing here connects to the office network.
name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: scripts/smoke.sh

      - name: Bundle
        if: github.event_name == 'push'
        run: |
          mkdir bundle
          scripts/bundle.sh bundle
          tar -czf "hub-${GITHUB_SHA::12}.tar.gz" -C bundle .
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hub-build --cleanup-tag --yes || true
          gh release create hub-build hub-*.tar.gz --target "$GITHUB_SHA" --prerelease \
            --title "Hub build" --notes "Built from $GITHUB_SHA"
